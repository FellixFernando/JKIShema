<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="kkrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a154b" />
      <stop offset="50%" stop-color="#6b21a8" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="lightRay" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#kkrGrad)" />
  <rect width="800" height="500" fill="url(#lightRay)" />
  <!-- Rays pattern -->
  <polygon points="400,100 200,500 250,500" fill="#fef08a" fill-opacity="0.15" />
  <polygon points="400,100 350,500 450,500" fill="#fef08a" fill-opacity="0.18" />
  <polygon points="400,100 550,500 600,500" fill="#fef08a" fill-opacity="0.15" />
  <!-- Church Cross Motif -->
  <rect x="390" y="80" width="20" height="110" fill="#ffffff" fill-opacity="0.8" rx="4" />
  <rect x="360" y="110" width="80" height="20" fill="#ffffff" fill-opacity="0.8" rx="4" />
  <!-- Text -->
  <rect x="0" y="280" width="800" height="220" fill="#000000" fill-opacity="0.4" />
  <text x="50" y="340" fill="#fde68a" font-family="system-ui, sans-serif" font-size="24" font-weight="800" letter-spacing="3">KKR JKI SHEMA 2026</text>
  <text x="50" y="390" fill="#ffffff" font-family="system-ui, sans-serif" font-size="38" font-weight="900" letter-spacing="1">KEBANGKITAN ROHANI</text>
  <text x="50" y="430" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="18" font-weight="600" letter-spacing="1">MENJADI TERANG DAN GARAM DUNIA</text>
</svg>
